name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Engineering package tests
        run: npm run test:engineering
        env:
          # Never refresh goldens in CI — drift must fail the job.
          UPDATE_GOLDENS: '0'

      - name: Angular unit tests
        run: npm run test:ci

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        # ubuntu-latest ≈7 GiB RAM. A modest heap ceiling documents the Node
        # side of memory pressure; OS OOM/SIGABRT (exit 134) is a separate limit.
        # Do not raise this blindly — see docs/architecture/baseline-v1.1.1.md.
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Confirm dist present (no artifact upload of secrets)
        run: test -d dist/fpv-trainer-web

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.lock resolves Symfony 8.x packages that require PHP >=8.4.1
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, tokenizer, xml, ctype, json, bcmath, fileinfo
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # CI checkouts have no .env; without it APP_KEY is null and phpdotenv
      # emits file_get_contents warnings on every test bootstrap.
      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run PHPUnit / Artisan tests
        run: php artisan test
